<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رابط الاستعلام عن نتيجة المرحلة الأولى لاختبارات المتقدمين للمشاركة في إقامة الشعائر بالجامع الأزهر ومجمعات الرواق الأزهري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--text:#1f2a24;--muted:#5d6b63;--green:#1b5e43;--green2:#14482f;--gold:#b8923a;--ok-bg:#e8f5ee;--ok-bd:#2e8b5e;--no-bg:#fbf3e4;--no-bd:#c9a14a;--err:#a33;}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--text:#eef2ef;--muted:#a3b2a9;--green:#3a9d73;--green2:#2f8461;--ok-bg:#183326;--no-bg:#33291a;}}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.9;min-height:100vh}
header{background:var(--green2);color:#fff;text-align:center;padding:28px 16px 32px;border-bottom:4px solid var(--gold)}
header h1{margin:0 auto;max-width:820px;font-size:clamp(1.1rem,3.2vw,1.6rem);line-height:1.8;font-weight:700}
main{max-width:560px;margin:-18px auto 40px;padding:0 16px}
.card{background:var(--card);border-radius:16px;padding:26px 22px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font:inherit;font-size:1.15rem;padding:12px 14px;border:2px solid #cfd8d2;border-radius:10px;background:var(--bg);color:var(--text);text-align:center;letter-spacing:1px;direction:ltr}
input:focus{outline:none;border-color:var(--green)}
button{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:1.1rem;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;cursor:pointer}
button:hover{background:var(--green2)}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
#result{margin-top:20px;display:none;border-radius:12px;padding:18px;font-size:1.1rem;font-weight:600;text-align:center;border:2px solid}
#result.ok{display:block;background:var(--ok-bg);border-color:var(--ok-bd)}
#result.no{display:block;background:var(--no-bg);border-color:var(--no-bd)}
#result.err{display:block;background:var(--no-bg);border-color:var(--err);color:var(--err)}
footer{text-align:center;color:var(--muted);font-weight:600;padding:8px 16px 32px}
#result .nm{color:var(--green);font-weight:700}
</style>
</head>
<body>
<header><h1>رابط الاستعلام عن نتيجة المرحلة الأولى لاختبارات المتقدمين للمشاركة في إقامة الشعائر بالجامع الأزهر ومجمعات الرواق الأزهري</h1></header>
<main>
<div class="card">
<label for="nid">أدخل الرقم القومي (14 رقمًا)</label>
<input id="nid" type="text" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="00000000000000">
<div class="hint">اكتب الرقم القومي ثم اضغط «استعلام».</div>
<button id="go" type="button">استعلام</button>
<div id="result" role="status" aria-live="polite"></div>
</div>
</main>
<footer>مع تحيات الجامع الأزهر - إدارة شئون الأروقة</footer>

const $=id=>document.getElementById(id);
function norm(s){
  return s.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x660)
          .replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x6F0)
          .replace(/\D/g,'');
}
async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function show(cls,html){const r=$('result');r.className=cls;r.innerHTML=html;}
async function search(){
  const id=norm($('nid').value);
  if(id.length!==14){show('err','برجاء إدخال الرقم القومي صحيحًا (14 رقمًا).');return;}
  let name;
  try{name=DATA[await sha256(id)];}
  catch(e){show('err','تعذّر إجراء الاستعلام، برجاء فتح الرابط من متصفح حديث.');return;}
  if(name){
    const safe=document.createElement('span');safe.textContent=name;
    show('ok','السلام عليكم (<span class="nm">'+safe.innerHTML+'</span>)<br>نفيدكم باجتيازكم اختبارات المرحلة الأولى وأنه قد تقرر عقد اختبارات المرحلة الثانية في حفظ القرآن الكريم يوم الأربعاء الموافق 28 أكتوبر 2026 في الجامع الأزهر في تمام الساعة العاشرة صباحا');
  }else{
    show('no','نسأل الله لكم التوفيق في فرصة قادمة');
  }
}
$('go').addEventListener('click',search);
$('nid').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
</script>
</body>
</html>
